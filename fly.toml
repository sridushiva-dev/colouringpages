# fly.toml — deploy with: fly launch && fly secrets set ADMIN_PASSWORD=your-secure-password
app = "colourpages-admin"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  CATALOG_DIR = "/catalog/books"
  DATA_DIR = "/data/books"
  PORT = "3000"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "20s"
    interval = "30s"
    method = "GET"
    path = "/api/health"
    timeout = "5s"

# Optional: persistent volume for catalog + artifacts (create with fly volumes create colourpages_data -r iad -s 1)
# [mounts]
#   source = "colourpages_data"
#   destination = "/data"
