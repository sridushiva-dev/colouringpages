services:
  - type: web
    name: colourpages-admin
    runtime: docker
    dockerfilePath: ./apps/admin/Dockerfile
    dockerContext: .
    plan: starter
    region: oregon
    healthCheckPath: /api/health
    envVars:
      - key: CATALOG_DIR
        value: /catalog/books
      - key: DATA_DIR
        value: /data/books
      - key: NODE_ENV
        value: production
      - key: ADMIN_PASSWORD
        sync: false  # set in Render dashboard
