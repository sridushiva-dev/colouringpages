pages:
- number: 1
  subject: Taj Mahal — classic view
  prompt: Paint the Taj Mahal as if it were carved entirely from ice.
  challenge: Add three hidden snowflakes in the architecture.
- number: 2
  subject: Taj Mahal — reflecting pool
  prompt: Color this scene as a sunset in a desert oasis.
  challenge: Make the reflection a different season than the sky.
- number: 3
  subject: Taj Mahal — garden pathway
  prompt: Imagine this garden is underwater — what grows here?
  challenge: Add two sea creatures hiding among the plants.
- number: 4
  subject: Taj Mahal — minaret detail
  prompt: Transform these minarets into towering crystal formations.
- number: 5
  subject: Taj Mahal — interior arch
  prompt: Color this arch as if it's a portal to another planet.
  challenge: Use only cool colors on the left, warm on the right.
