[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "colourpages-production"
version = "0.1.0"
description = "KDP production pipeline for ColourPages coloring books"
requires-python = ">=3.10"
dependencies = [
    "Pillow>=10.0",
    "PyYAML>=6.0",
    "reportlab>=4.0",
    "qrcode[pil]>=7.4",
    "imagehash>=4.3",
    "click>=8.1",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "ruff>=0.1"]

[project.scripts]
colourpages-preflight = "colourpages_production.cli:preflight_cmd"
colourpages-build = "colourpages_production.cli:build_cmd"
colourpages-layout = "colourpages_production.cli:layout_cmd"
colourpages-placeholders = "colourpages_production.cli:placeholders_cmd"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
